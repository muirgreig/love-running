<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Meta tags for search engine-->
  <meta name="description" content="Love Running. Club for runners in Dublin, Ireland. Urban running, trail running. Dublin docklands and Phoenix Park">
  <meta name="keywords" content="love running, run, running club, runners, Ireland, Dublin, sport, exercise">
  <!--Title -->
  <title>Love Running</title>
  <!--Fav Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
  <!--Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
    <!--Header-->
      <header>
        
        <a href="index.html">
            <h1 id="logo">Love Running</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle" />
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>

         <nav>
            <ul id="menu">
              <li><a href="" >Home</a></li>
              <li><a href="gallery.html">Gallery</a></li>
              <li><a href="signup.html" class="active">Sign Up</a></li>
            </ul>
        </nav>
           

      
    </header>
    <!--Main Content-->
    <main>
        
      <section id="sign-up">
            
          <form action="https://formdump.codeinstitute.net" id="signup-form" method="POST">
            
              <h2><i class="fa-solid fa-heart-pulse"></i>Let's get you signed up!</h2>
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" class="text-input" required>
                <br>
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" class="text-input" required>
                <br>
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" class="text-input" required>
                <br>

                <div class="radio-buttons">
                    <div>
                        <label for="Road">Road</label>
                        <input type="radio" id="Road" name="running_preference" value="Road" required checked>
                    </div>
                    
                    <div>
                        <label for="Trail">Trail</label>
                        <input type="radio" id="Trail" name="running_preference" value="Trail">
                    </div>
                    
                    <div>
                        <label for="Both">Both</label>
                        <input type="radio" id="Both" name="running_preference" value="Both">
                    </div>
                    
                </div>
                 <input type="submit" class="join-button" name="join-button" value="Submit">
              </form>



        </section>




    </main>
      
    <!--Footer-->
    <footer>
      <ul id="social-networks">
        <li><a href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Visit our Facebook page (opens in new tab)"><i class="fa-brands fa-facebook"></i></a></li>
        <li><a href="https://www.twitter.com" target="_blank" rel="noopener" aria-label="Visit our Twitter page (opens in new tab)"><i class="fa-brands fa-twitter"></i></a></li>
        <li><a href="https://www.youtube.com" target="_blank" rel="noopener" aria-label="Visit our YouTube page (opens in new tab)"><i class="fa-brands fa-youtube"></i></a></li>
        <li><a href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Visit our Instagram page (opens in new tab)"><i class="fa-brands fa-instagram"></i></a></li>
      
      
      </ul>


    </footer>
      
    <!--Font-Awesome kit-->
    <script src="https://kit.fontawesome.com/ba5c27b99d.js" crossorigin="anonymous"></script>
</body>

</html>
